analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    # Synthetic import-lexer fixtures under fake package names (a, b,
    # data_local, get_it, flutter) that are deliberately unresolvable -
    # scanned by the deterministic import validator's own lexer, not by
    # the analyzer.
    - test/fixtures/workspaces/imports/packages/**
